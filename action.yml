name: "OpenRouter PR Review"
description: >-
  OpenRouter pull-request reviews with a custom harness and an optional
  multi-model bake-off. Authenticates with OPENROUTER_API_KEY against
  openrouter.ai only.
author: "Nathan / RetireGolden, LLC"
branding:
  icon: "eye"
  color: "blue"

inputs:
  role:
    description: >-
      all (default: collect, run lanes, judge when time and lane count permit,
      then post) | setup (prepare a shared review snapshot and matrix when
      policy/profiles are enabled; otherwise parse models) | lane (one model) |
      judge (merge artifacts and post).
    required: false
    default: "all"
  models:
    description: >-
      Comma-separated OpenRouter model slugs. List length is the lane count
      (hard-capped at 4). Default is today's Grok 4.6 slug on OpenRouter.
      One model = one lane; the judge is skipped unless judge_needed is true.
    required: false
    default: ""
  model_routes:
    description: >-
      Trusted JSON object keyed by exact review model slug, each with optional
      provider (pinned without fallbacks) and service_tier (default, flex, priority).
      Applies only to matching review lanes, not the judge. Maximum four entries
      and 8,000 UTF-8 bytes. Never interpolate PR content into this input.
    required: false
    default: ""
  judge_model:
    description: >-
      OpenRouter slug for the merge/de-dupe judge (independent of models).
      Used whenever judging is enabled. Default is openai/gpt-5.6-luna. See
      README for the measured selection rationale.
    required: false
    default: ""
  judge_needed:
    description: >-
      true enables the judge and forces it for one configured lane; false skips
      it. Empty infers from models length. If only one of several lanes succeeds,
      that surviving lane posts directly because there is nothing to merge.
    required: false
    default: ""
  github_token:
    description: "Token used to read the PR and post comments/reviews."
    required: false
    default: ${{ github.token }}
  github_timeout_seconds:
    description: "Timeout for each GitHub CLI or fallback local-git operation (1-600 seconds)."
    required: false
    default: "120"
  job_budget_seconds:
    description: >-
      Total action budget in seconds, measured from Python startup. Default
      1320 leaves time for review publication before a 25-minute job timeout.
    required: false
    default: "1320"
  all_role_deadline_seconds:
    description: >-
      Optional wall-clock cap for concurrent lanes in role=all. Empty derives
      from job_budget_seconds after publication and judge reserves.
    required: false
    default: ""
  pr_number:
    description: "PR number to review. Defaults to the PR that triggered the workflow."
    required: false
    default: ""
  fail_on:
    description: "Finding policy: never | bugs | any. Operational errors always fail."
    required: false
    default: "never"
  roast_level:
    description: "Public comment tone: professional | playful. Default professional."
    required: false
    default: "professional"
  custom_instructions:
    description: "Extra prompt instructions (max 16,000 UTF-8 bytes; do not include secrets)."
    required: false
    default: ""
  path_profiles:
    description: "Caller-owned additive review profiles as a JSON array of {name?, paths: [globs], instructions} — applied only when a changed path matches (path-glob semantics: * and ? stay within a segment, ** crosses); never narrows the review (max 20 profiles and 16,000 UTF-8 bytes). TRUSTED workflow configuration only: never interpolate PR content or repository files into this input, and do not include secrets."
    required: false
    default: ""
  review_policy:
    description: >-
      off (default) or base: load bounded hierarchical REVIEW.md guidance from
      the immutable PR target-branch commit. Requires a full-depth source
      checkout. Matrix roles consume a snapshot prepared by setup.
      PR policy edits cannot govern their own review.
    required: false
    default: "off"
  review_profiles:
    description: >-
      Trusted version-1 JSON registry of named standard/deep panels with models,
      required lanes, judge, reasoning effort, and bounded tool/time limits.
      Maximum 8 profiles, 4 lanes per panel, and 32 KiB. Do not combine with
      models, judge_model, judge_needed, or effort; never interpolate PR content.
    required: false
    default: ""
  review_level:
    description: >-
      auto (default) follows target-branch policy; deep raises the requested
      level and reviews the full PR while retaining the existing ledger.
      Deep requires a configured deep panel. This input does not grant merge authority.
    required: false
    default: "auto"
  lane_timeout_seconds:
    description: >-
      Hard per-lane ceiling in seconds for prepared profiles (1-1800).
      Selected profiles must fit this ceiling and the total job budget.
    required: false
    default: "1080"
  review_context_file:
    description: >-
      Setup snapshot path for prepared all/lane/judge roles.
      Use only the context artifact from this workflow run and attempt.
    required: false
    default: ""
  review_context_output_file:
    description: >-
      Optional setup snapshot destination outside this action's temporary
      directory, for reuse by later steps in the same trusted job.
    required: false
    default: ""
  review_context_sha256:
    description: >-
      Expected snapshot digest from the trusted setup job output. Required
      with review_context_file; a digest is not a substitute for trusted artifact provenance.
    required: false
    default: ""
  status_comments:
    description: "Post/update a live status comment on the PR."
    required: false
    default: "true"
  max_diff_kb:
    description: >-
      Maximum diff size (KB) embedded in the prompt. Over-budget diffs go
      through diff-budget triage: generated/vendored/lock-class files are
      demoted to stubs (still tool-readable, still requiring coverage) so
      hand-written hunks fit; only files dropped entirely force partial.
    required: false
    default: "300"
  generated_paths:
    description: >-
      Extra path globs (JSON array of strings, e.g. ["src/data/**/*.json"])
      treated as generated/vendored during diff-budget triage, in addition to
      .gitattributes linguist-generated/linguist-vendored and the built-in
      lockfile heuristics. Demotion only changes packing priority of an
      over-budget diff — demoted files stay stubbed, tool-readable, and
      coverage-accounted, never excluded. TRUSTED workflow configuration
      only: never interpolate PR content or repository files into this input.
      Maximum 8,000 UTF-8 bytes and 200 globs.
    required: false
    default: ""
  review_scope:
    description: >-
      Diff to embed: full-pr, latest-commit, or rebase. Rebase reviews the whole
      PR with history and requires an existing ledger. Divergent latest-commit
      history automatically selects rebase; transient compare errors stay partial.
    required: false
    default: "full-pr"
  review_mode:
    description: >-
      Loop position: auto continues an existing ledger for any event and seeds
      an initial review otherwise. initial explicitly resets; verify requires a ledger.
    required: false
    default: "auto"
  effort:
    description: "Optional OpenRouter reasoning effort (for example low | medium | high)."
    required: false
    default: ""
  max_tool_turns:
    description: >-
      Read-only tool-call rounds against the inert checkout (0 disables tools).
      Default 50 matches the sibling Grok first-pass max_turns. Follow-up
      jobs may pass a lower value (sibling callers often use 30).
    required: false
    default: "50"
  openrouter_timeout_seconds:
    description: "Connection/header setup and socket inactivity limit per OpenRouter HTTP attempt (1-600 seconds); active responses share the remaining lane-stage deadline. Without a stage deadline, also limits elapsed time."
    required: false
    default: "180"
  lane_index:
    description: "Zero-based lane index (role=lane). Used for artifact names."
    required: false
    default: "0"
  lane_model:
    description: "Override the model slug for role=lane (defaults to models / matrix)."
    required: false
    default: ""
  lane_results_dir:
    description: "Directory of lane-N.json artifacts (role=judge) or write target (role=lane)."
    required: false
    default: ""
  head_sha:
    description: >-
      Full reviewed commit SHA resolved by reusable-workflow setup. Internal
      lane/judge plumbing; pull_request runs default to the event head SHA.
    required: false
    default: ""
  approve:
    description: >-
      off (default) | clean. clean submits the review as an APPROVE when the
      verdict is clean with no open findings; every other review stays a
      COMMENT. The action never requests changes. Needs the repository
      setting that allows GitHub Actions to approve pull requests; if GitHub
      refuses, the review posts as a COMMENT with a warning.
    required: false
    default: "off"
  compaction:
    description: >-
      auto (default) | off | none. On re-reviews (verify mode or rebase scope),
      auto lets compaction_model write a cached brief of a long PR body and of
      history that overflows the budget. off disables that brief; the
      deterministic history compaction still applies. none skips both: earlier
      reviews, replies and comments go to the prompt verbatim up to 256,000
      bytes, and larger history falls back to deterministic compaction.
      Initial reviews are unchanged.
    required: false
    default: "auto"
  compaction_model:
    description: >-
      OpenRouter slug for the re-review brief. Empty (default) skips the
      brief, so only deterministic compaction applies. Uses this slug's
      model_routes entry when present. Any failure falls back to the full
      body.
    required: false
    default: ""
  bot_login:
    description: >-
      GitHub login this action posts reviews as. Review-loop ledger state is
      only trusted from reviews authored by this identity. Change it when
      github_token is a PAT or GitHub App token.
    required: false
    default: "github-actions[bot]"
  # Reserved unused hook. v1 ignores this and uses the same review prompt
  # on every lane. A later persona input can land here without rewriting
  # the setup / lane / judge layout. A future single-persona run should
  # skip the judge the same way (one reviewer = no judge).
  persona:
    description: >-
      Reserved unused hook for a future persona input. Ignored in v1.
      A future single-persona run should skip the judge (one reviewer = no judge).
    required: false
    default: ""

outputs:
  review_profile:
    description: "Resolved named review profile for prepared execution."
    value: ${{ steps.run.outputs.review_profile }}
  review_level:
    description: "Resolved standard or deep review level."
    value: ${{ steps.run.outputs.review_level }}
  review_trigger:
    description: "Why this level was selected: baseline, policy, or manual."
    value: ${{ steps.run.outputs.review_trigger }}
  registry_digest:
    description: "Identity of the trusted profile registry and model routes."
    value: ${{ steps.run.outputs.registry_digest }}
  profile_satisfied:
    description: "true only when the prepared review satisfies its required reviewers and runtime constraints."
    value: ${{ steps.run.outputs.profile_satisfied }}
  panel_status:
    description: "Prepared panel outcome: complete, degraded, required_missing, or error."
    value: ${{ steps.run.outputs.panel_status }}
  review_context_sha256:
    description: "Expected digest for the shared setup snapshot."
    value: ${{ steps.run.outputs.review_context_sha256 }}
  review_context_artifact:
    description: "Artifact containing the prepared review context for this run and attempt."
    value: ${{ steps.run.outputs.review_context_file != '' && format('openrouter-review-context-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  review_receipt_artifact:
    description: "Artifact containing the canonical prepared review receipt from this run and attempt."
    value: ${{ steps.run.outputs.review_receipt_file != '' && format('openrouter-review-receipt-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  head_sha:
    description: "Immutable reviewed head resolved by setup."
    value: ${{ steps.run.outputs.head_sha }}
  policy_digest:
    description: "SHA-256 of the effective repository review guidance, when enabled."
    value: ${{ steps.run.outputs.policy_digest }}
  policy_base_sha:
    description: "Immutable target-branch commit supplying review guidance."
    value: ${{ steps.run.outputs.policy_base_sha }}
  verdict:
    description: "Review verdict: clean | issues | partial | error"
    value: ${{ steps.run.outputs.verdict }}
  issue_count:
    description: "Open findings after this round (carried-over plus new; nits retired by the severity floor excluded)."
    value: ${{ steps.run.outputs.issue_count }}
  bug_count:
    description: "Open bug-severity findings after this round."
    value: ${{ steps.run.outputs.bug_count }}
  round:
    description: "Review-loop round number this run performed."
    value: ${{ steps.run.outputs.round }}
  review_url:
    description: "URL of the posted GitHub review or status comment."
    value: ${{ steps.run.outputs.review_url }}
  models_json:
    description: "JSON array of parsed OpenRouter slugs (setup / all)."
    value: ${{ steps.run.outputs.models_json }}
  matrix:
    description: "JSON array of {index, model} for a GitHub Actions matrix."
    value: ${{ steps.run.outputs.matrix }}
  lane_count:
    description: "Number of model lanes after parsing."
    value: ${{ steps.run.outputs.lane_count }}
  judge_needed:
    description: "Prepared setup always requires a judge/publisher job, even for one lane. Other roles report the configured LLM-judge decision."
    value: ${{ steps.run.outputs.judge_needed }}
  judge_model:
    description: "OpenRouter slug used when judging is enabled."
    value: ${{ steps.run.outputs.judge_model }}
  lane_file:
    description: "Path of the written lane JSON (role=lane)."
    value: ${{ steps.run.outputs.lane_file }}
  lane_ok:
    description: "true if this lane produced structured findings (role=lane)."
    value: ${{ steps.run.outputs.lane_ok }}

runs:
  using: "composite"
  steps:
    - name: Prepare workdir
      id: dirs
      shell: bash
      run: |
        WORK="$(mktemp -d "${RUNNER_TEMP:-/tmp}/or-pr-review.XXXXXX")"
        ALL_LANE_RESULTS_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/or-pr-review-lanes.XXXXXX")"
        echo "work=$WORK" >> "$GITHUB_OUTPUT"
        echo "all_lane_results_dir=$ALL_LANE_RESULTS_DIR" >> "$GITHUB_OUTPUT"

    - name: Run OpenRouter PR review
      id: run
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        ROLE: ${{ inputs.role }}
        MODELS: ${{ inputs.models }}
        MODEL_ROUTES: ${{ inputs.model_routes }}
        JUDGE_MODEL: ${{ inputs.judge_model }}
        JUDGE_NEEDED: ${{ inputs.judge_needed }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TIMEOUT_SECONDS: ${{ inputs.github_timeout_seconds }}
        JOB_BUDGET_SECONDS: ${{ inputs.job_budget_seconds }}
        ALL_ROLE_DEADLINE_SECONDS: ${{ inputs.all_role_deadline_seconds }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        FAIL_ON: ${{ inputs.fail_on }}
        ROAST_LEVEL: ${{ inputs.roast_level }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        PATH_PROFILES: ${{ inputs.path_profiles }}
        REVIEW_POLICY: ${{ inputs.review_policy }}
        REVIEW_PROFILES: ${{ inputs.review_profiles }}
        REVIEW_LEVEL: ${{ inputs.review_level }}
        LANE_TIMEOUT_SECONDS: ${{ inputs.lane_timeout_seconds }}
        REVIEW_CONTEXT_FILE: ${{ inputs.review_context_file }}
        REVIEW_CONTEXT_OUTPUT_FILE: ${{ inputs.review_context_output_file }}
        REVIEW_CONTEXT_SHA256: ${{ inputs.review_context_sha256 }}
        GENERATED_PATHS: ${{ inputs.generated_paths }}
        STATUS_COMMENTS: ${{ inputs.status_comments }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        REVIEW_SCOPE: ${{ inputs.review_scope }}
        REVIEW_MODE: ${{ inputs.review_mode }}
        EFFORT: ${{ inputs.effort }}
        MAX_TOOL_TURNS: ${{ inputs.max_tool_turns }}
        OPENROUTER_TIMEOUT_SECONDS: ${{ inputs.openrouter_timeout_seconds }}
        LANE_INDEX: ${{ inputs.lane_index }}
        LANE_MODEL: ${{ inputs.lane_model }}
        LANE_RESULTS_DIR: ${{ inputs.lane_results_dir }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        APPROVE: ${{ inputs.approve }}
        COMPACTION: ${{ inputs.compaction }}
        COMPACTION_MODEL: ${{ inputs.compaction_model }}
        PERSONA: ${{ inputs.persona }}
        WORK: ${{ steps.dirs.outputs.work }}
        ALL_LANE_RESULTS_DIR: ${{ steps.dirs.outputs.all_lane_results_dir }}
        SOURCE_WORKSPACE: ${{ github.workspace }}
        # Preserve event context when pr_number is omitted or explicitly names
        # the triggering PR. A different PR must not inherit its head/range/mode.
        EVENT_BEFORE: ${{ (inputs.pr_number == '' || inputs.pr_number == format('{0}', github.event.pull_request.number)) && github.event.before || '' }}
        EVENT_AFTER: ${{ (inputs.pr_number == '' || inputs.pr_number == format('{0}', github.event.pull_request.number)) && github.event.after || '' }}
        HEAD_SHA: ${{ inputs.head_sha || ((inputs.pr_number == '' || inputs.pr_number == format('{0}', github.event.pull_request.number)) && github.event.pull_request.head.sha) || '' }}
        EVENT_ACTION: ${{ (inputs.pr_number == '' || inputs.pr_number == format('{0}', github.event.pull_request.number)) && github.event.action || '' }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # -P prevents the untrusted reviewed checkout from shadowing the action's
      # Python package ahead of the trusted PYTHONPATH entry above.
      run: python3 -P -u -m or_pr_review

    - name: Preserve prepared review context
      if: ${{ always() && steps.run.outputs.review_context_file != '' && (inputs.role == 'setup' || (inputs.role == 'all' && inputs.review_context_file == '')) }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: openrouter-review-context-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.review_context_file }}
        if-no-files-found: error
        retention-days: 30

    - name: Preserve prepared review receipt
      if: ${{ always() && steps.run.outputs.review_receipt_file != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: openrouter-review-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.run.outputs.review_receipt_file }}
        if-no-files-found: error
        retention-days: 30

    - name: Preserve completed all-role lanes
      if: ${{ always() && inputs.role == 'all' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: openrouter-review-lanes-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.dirs.outputs.all_lane_results_dir }}/lane-*.json
          ${{ steps.dirs.outputs.all_lane_results_dir }}/progress-*.json
        if-no-files-found: ignore
        retention-days: 3

    - name: Cleanup temporary files
      if: ${{ always() }}
      shell: bash
      env:
        WORK: ${{ steps.dirs.outputs.work }}
        ALL_LANE_RESULTS_DIR: ${{ steps.dirs.outputs.all_lane_results_dir }}
      run: |
        if [ -n "$WORK" ] && [ -d "$WORK" ]; then
          case "$WORK" in
            "${RUNNER_TEMP:-/tmp}"/or-pr-review.*) rm -rf "$WORK" ;;
          esac
        fi
        if [ -n "$ALL_LANE_RESULTS_DIR" ] && [ -d "$ALL_LANE_RESULTS_DIR" ]; then
          case "$ALL_LANE_RESULTS_DIR" in
            "${RUNNER_TEMP:-/tmp}"/or-pr-review-lanes.*) rm -rf "$ALL_LANE_RESULTS_DIR" ;;
          esac
        fi
